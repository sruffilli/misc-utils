name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never run two deploys at once: they push to the same repository.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist (precompiled Tailwind CSS)
        run: python3 scripts/build_dist.py

      - name: Deploy to sruffilli.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN is not set. Please set it in repository secrets."
            exit 1
          fi

          # Clone the destination repository using token
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/sruffilli/sruffilli.github.io.git out

          cd out

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only index.html and webutils/ belong to this repo; everything
          # else in the destination is published by other repositories.
          cp ../dist/index.html .

          # Synchronize the webutils directory (clean replace)
          rm -rf webutils
          cp -r ../dist/webutils .

          git add index.html webutils

          # Commit and push only if there are changes
          if git status --porcelain | grep -q .; then
            git commit -m "Auto-deploy from misc-utils ${GITHUB_SHA::7}"
            git push origin main
          else
            echo "No changes to commit"
          fi
