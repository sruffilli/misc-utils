name: Tests

on:
  push:
    branches-ignore:
      - main # main is tested by deploy.yml before it deploys
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium for Playwright
        # keep in sync with the playwright pin in tests/smoke_test.py
        run: uv run --with playwright==1.63.0 playwright install --with-deps chromium

      - name: Test source pages
        run: uv run tests/smoke_test.py

      - name: Build dist
        run: python3 scripts/build_dist.py

      - name: Test built pages
        run: SITE=dist uv run tests/smoke_test.py
